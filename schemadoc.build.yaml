schema: schema/artifact-config-v1beta.json

mod2schema:
  module: .
  package: github.com/ocidoc/ocidoc-go/spec
  type: ArtifactConfig
  key_namer: none

merge:
  patches:
    - file: schema/patches/artifact-config-v1beta.json
      op:
        node: merge

schema2doc:
  title: OCIDoc artifact configuration (v1beta)
  template: table
  mode: all
  format: json
  output: docs/artifact-config-v1beta.md
